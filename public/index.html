<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>MayoRitas™</title>
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body {
    background: #fff;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, sans-serif;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin: 0 4px 16px 4px;
    padding: 10px 12px;
    background: #f7f7f7;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
  }
  h1 {
    color: #222;
    font-size: 18px;
    font-weight: 500;
    margin: 0;
    white-space: nowrap;
  }
  .controls, .filter-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .grid-size-label {
    color: #444;
    font-size: 13px;
  }
  input[type="range"] {
    width: 80px;
  }
  #filterPreset {
    max-width: 150px;
  }
  select, button.action-btn {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #fff;
    color: #222;
  }
  button.action-btn {
    cursor: pointer;
    background: #2962FF;
    color: #fff;
    border-color: #2962FF;
  }
  button.action-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .status-text {
    font-size: 12px;
    color: #666;
  }
  .grid {
    display: grid;
    gap: 8px;
  }
  .chart-box {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    aspect-ratio: 4 / 3;
  }
  .ticker-label {
    color: #555;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 8px;
    background: #f7f7f7;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .ticker-label .price-tag {
    font-weight: 500;
    color: #888;
  }
  .chart-canvas {
    flex: 1;
    min-height: 0;
  }
  .legend {
    display: flex;
    gap: 8px;
    padding: 3px 8px;
    font-size: 10px;
    background: #fafafa;
    border-top: 1px solid #eee;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .legend span {
    display: flex;
    align-items: center;
    gap: 3px;
    color: #666;
  }
  .legend .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: #999;
    padding: 40px;
    font-size: 14px;
  }
    .chart-box { cursor: pointer; }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 8px;
    width: min(1100px, 100%);
    height: min(720px, 90vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid #eee;
    font-size: 15px;
    font-weight: 600;
  }
  .modal-close {
    cursor: pointer;
    border: none;
    background: none;
    font-size: 20px;
    color: #666;
    line-height: 1;
  }
  .modal-chart { flex: 1; min-height: 0; }
</style>
</head>
<body>

<div class="header-row">
  <h1>MayoRitas™</h1>
  <div class="controls">
    <span class="grid-size-label">Column: <span id="colVal">4</span></span>
    <input type="range" id="colSlider" min="2" max="5" value="4">
  </div>
  <div class="filter-controls">
    <select id="filterPreset">
      <option value="none" selected>All</option>
      <option value="above_ma50">Price > MA50</option>
      <option value="below_ma50">Price "<" MA50</option>
      <option value="below_ma50">Price > All MA</option>
      <option value="below_ma50">Price "<" All MA</option>
      <option value="below_ma50">Bigcap</option>
      <option value="below_ma50">Midcap</option>
      <option value="below_ma50">Smallcap</option>
      <option value="below_ma50">Technology</option>
      <option value="below_ma50">Financial</option>
    </select>
    <button class="action-btn" id="applyBtn">Apply</button>
    <span class="status-text" id="statusText">Data belum dimuat</span>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modalTitle"></span>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-chart" id="modalChart"></div>
  </div>
</div>
<script>
// ====== EDIT DI SINI SAJA — tambah/hapus ticker di array ini ======
const tickers = [
  "BBCA","BMRI","BBRI","BBNI","BREN","PTRO","TPIA","CDIA","BUMI",
  "WBSA","TLKM","EMAS","BRMS","PSAB","ANTM"
];
// ====================================================================

const MA_COLORS = {
  10: "#2962FF",
  20: "#00C853",
  50: "#FFD600",
  100: "#FF9100",
  200: "#FF1744"
};

const grid = document.getElementById("grid");
const colSlider = document.getElementById("colSlider");
const colVal = document.getElementById("colVal");
const filterPreset = document.getElementById("filterPreset");
const applyBtn = document.getElementById("applyBtn");
const statusText = document.getElementById("statusText");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalChartEl = document.getElementById("modalChart");
const modalClose = document.getElementById("modalClose");

function getDefaultCols() {
  const isMobile = window.matchMedia("(max-width: 900px)").matches;
  const isLandscape = window.matchMedia("(orientation: landscape)").matches;
  if (isMobile && isLandscape) return 3;
  return 4;
}
const defaultCols = getDefaultCols();
colSlider.value = defaultCols;
colVal.textContent = defaultCols;

let stockData = {};      // { BBCA: { candles, ma, lastClose, ma50, ma200, ok } }
let visibleTickers = [...tickers];
let chartInstances = {}; // { BBCA: { chart, candleSeries, maSeries, box } }

// ---- CACHE (localStorage, TTL 6 jam) ----
const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
const CACHE_KEY = "mayoritas_stock_cache_v2";

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    const now = Date.now();
    const fresh = {};
    Object.entries(parsed).forEach(([ticker, entry]) => {
      if (entry.ts && now - entry.ts < CACHE_TTL_MS && entry.data && entry.data.ok) fresh[ticker] = entry.data;
    });
    return fresh;
  } catch (e) { return {}; }
}

function saveCacheEntry(ticker, data) {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    parsed[ticker] = { ts: Date.now(), data };
    localStorage.setItem(CACHE_KEY, JSON.stringify(parsed));
  } catch (e) { /* localStorage penuh/diblokir, abaikan */ }
}

// ---- MA CALC ----
function sma(closes, period, endIndex) {
  if (endIndex - period + 1 < 0) return null;
  let sum = 0;
  for (let i = endIndex - period + 1; i <= endIndex; i++) sum += closes[i];
  return sum / period;
}

function smaSeries(candles, period) {
  const out = [];
  for (let i = period - 1; i < candles.length; i++) {
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += candles[j].close;
    out.push({ time: candles[i].time, value: sum / period });
  }
  return out;
}

// ---- DATA LAYER: Yahoo Finance via server-side proxy ----
async function fetchStock(ticker) {
  const url = `/.netlify/functions/stock?symbol=${ticker}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    if (json.status === "error") throw new Error(json.message || "API error");
    if (!json.values || json.values.length < 15) throw new Error("data historis kurang dari 15 hari");

    const candles = json.values
      .map(v => ({
        time: v.datetime,
        open: parseFloat(v.open),
        high: parseFloat(v.high),
        low: parseFloat(v.low),
        close: parseFloat(v.close)
      }))
      .reverse();

    const closes = candles.map(c => c.close);
    const n = closes.length - 1;

    const ma = {};
    [10, 20, 50, 100, 200].forEach(p => { ma[p] = smaSeries(candles, p); });

    const ma50Now = sma(closes, 50, n);
    const ma200Now = sma(closes, 200, n);
    const ma50Prev = sma(closes, 50, n - 1);
    const ma200Prev = sma(closes, 200, n - 1);

    return {
      ticker, ok: true, candles, ma,
      lastClose: closes[n], ma50: ma50Now, ma200: ma200Now, ma50Prev, ma200Prev
    };
  } catch (err) {
    return { ticker, ok: false, error: err.message };
  }
}

// ---- Fetch pool paralel (ganti serial + sleep) ----
async function loadAllData() {
  statusText.textContent = "Memuat data...";
  applyBtn.disabled = true;

  const cached = loadCache();
  const toFetch = tickers.filter(t => !cached[t]);

  Object.entries(cached).forEach(([ticker, data]) => {
    stockData[ticker] = data;
    populateChart(ticker);
  });

  let okCount = Object.values(stockData).filter(d => d.ok).length;
  let failCount = Object.values(stockData).filter(d => !d.ok).length;
  let done = 0;

  if (toFetch.length > 0) {
    statusText.textContent = `Memuat data baru untuk ${toFetch.length} saham (cache: ${tickers.length - toFetch.length})...`;
  }

  const CONCURRENCY = 6; // naikkan/turunkan kalau Yahoo mulai nge-block (429/403)
  let cursor = 0;
  async function worker() {
    while (cursor < toFetch.length) {
      const t = toFetch[cursor++];
      const r = await fetchStock(t);
      stockData[r.ticker] = r;
      saveCacheEntry(r.ticker, r);
      if (r.ok) okCount++; else failCount++;
      done++;
      statusText.textContent = `Memuat data baru... (${done}/${toFetch.length})`;
      populateChart(r.ticker); // isi chart yang udah ke-mount begitu datanya siap
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, toFetch.length || 1) }, worker));

  statusText.textContent = `Data siap: ${okCount} sukses` + (failCount ? `, ${failCount} gagal` : "");
  applyBtn.disabled = false;
}

function passesFilter(ticker, mode) {
  if (mode === "none") return true;
  const d = stockData[ticker];
  if (!d || !d.ok) return false;
  switch (mode) {
    case "above_ma50": return d.ma50 != null && d.lastClose > d.ma50;
    case "below_ma50": return d.ma50 != null && d.lastClose < d.ma50;
    default: return true;
  }
}

// ---- Box dibikin murah dulu (cuma DOM), chart asli dibuat pas kelihatan layar ----
const mountObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      mountChart(entry.target.dataset.symbol, entry.target);
      mountObserver.unobserve(entry.target);
    }
  });
}, { rootMargin: "600px 0px" }); // mulai mount 600px sebelum masuk viewport, biar nggak keliatan nge-lag

function renderOne(symbol) {
  const box = document.createElement("div");
  box.className = "chart-box";
  box.dataset.symbol = symbol;

  const label = document.createElement("div");
  label.className = "ticker-label";
  const d = stockData[symbol];
  const priceText = d && d.ok ? d.lastClose.toLocaleString("id-ID") : "…";
  label.innerHTML = `<span>${symbol}</span><span class="price-tag">${priceText}</span>`;
  box.appendChild(label);

  const canvasWrap = document.createElement("div");
  canvasWrap.className = "chart-canvas";
  canvasWrap.textContent = "Memuat…";
  box.appendChild(canvasWrap);

  const legend = document.createElement("div");
  legend.className = "legend";
  [10, 20, 50, 100, 200].forEach(p => {
    legend.innerHTML += `<span><span class="dot" style="background:${MA_COLORS[p]}"></span>MA${p}</span>`;
  });
  box.appendChild(legend);

  box.addEventListener("click", () => openFullChart(symbol));
  grid.appendChild(box);
  mountObserver.observe(box);
}

function mountChart(symbol, box) {
  const canvasWrap = box.querySelector(".chart-canvas");
  canvasWrap.textContent = "";

  const chart = LightweightCharts.createChart(canvasWrap, {
    layout: { textColor: "#333", background: { type: "solid", color: "#ffffff" } },
    grid: { vertLines: { color: "#eee" }, horzLines: { color: "#eee" } },
    timeScale: { borderColor: "#ddd", timeVisible: false, rightOffset: 0, fixLeftEdge: true, fixRightEdge: true },
    rightPriceScale: { borderColor: "#ddd" },
    localization: { priceFormatter: p => Math.round(p).toLocaleString("id-ID") },
    handleScroll: false,
    handleScale: false,
    attributionLogo: false
  });

  const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
    wickUpColor: "#26a69a", wickDownColor: "#ef5350"
  });

  const maSeries = {};
  [10, 20, 50, 100, 200].forEach(p => {
    maSeries[p] = chart.addSeries(LightweightCharts.LineSeries, {
      color: MA_COLORS[p], lineWidth: 1, priceLineVisible: false, lastValueVisible: true
    });
  });

  new ResizeObserver(() => {
    chart.applyOptions({ width: canvasWrap.clientWidth, height: canvasWrap.clientHeight });
    chart.timeScale().fitContent();
  }).observe(canvasWrap);

  chartInstances[symbol] = { chart, candleSeries, maSeries, box };
  populateChart(symbol);
}

// ---- Isi/refresh data ke chart yang sudah ke-mount ----
function populateChart(symbol) {
  const inst = chartInstances[symbol];
  const d = stockData[symbol];
  if (!inst || !d) return;

  const label = inst.box.querySelector(".price-tag");
  if (label) label.textContent = d.ok ? d.lastClose.toLocaleString("id-ID") : "…";
  if (!d.ok) return;

  const currentYear = new Date().getFullYear();
  const ytdStart = `${currentYear}-01-01`;
  const ytdCandles = d.candles.filter(c => c.time >= ytdStart);
  const displayCandles = ytdCandles.length > 10 ? ytdCandles : d.candles.slice(-180);

  inst.candleSeries.setData(displayCandles);
  const minTime = displayCandles[0].time;
  [10, 20, 50, 100, 200].forEach(p => {
    inst.maSeries[p].setData(d.ma[p].filter(pt => pt.time >= minTime));
  });
  inst.chart.timeScale().fitContent();
}

function renderGrid(list) {
  grid.innerHTML = "";
  chartInstances = {};
  if (list.length === 0) {
    const msg = document.createElement("div");
    msg.className = "empty-msg";
    msg.textContent = "Tidak ada saham yang lolos filter ini.";
    grid.appendChild(msg);
    return;
  }
  grid.style.gridTemplateColumns = `repeat(${colSlider.value}, 1fr)`;
  list.forEach(symbol => renderOne(symbol));
}

colSlider.addEventListener("input", () => {
  colVal.textContent = colSlider.value;
  grid.style.gridTemplateColumns = `repeat(${colSlider.value}, 1fr)`;
});

applyBtn.addEventListener("click", () => {
  const mode = filterPreset.value;
  const newVisible = tickers.filter(t => passesFilter(t, mode));
  const sameAsCurrent = newVisible.length === visibleTickers.length &&
    newVisible.every((t, i) => t === visibleTickers[i]);
  statusText.textContent = `${newVisible.length} dari ${tickers.length} saham lolos filter`;
  if (sameAsCurrent) return;
  visibleTickers = newVisible;
  renderGrid(visibleTickers);
});

// ---- Modal full-size: 1 chart instance dipakai ulang, data dari memori (instan) ----
let modalChart = null;
let modalCandleSeries = null;
let modalMaSeries = {};

function openFullChart(symbol) {
  const d = stockData[symbol];
  if (!d || !d.ok) return;

  modalTitle.textContent = `${symbol} — ${d.lastClose.toLocaleString("id-ID")}`;
  modalOverlay.classList.add("open");

  if (!modalChart) {
    modalChart = LightweightCharts.createChart(modalChartEl, {
      layout: { textColor: "#333", background: { type: "solid", color: "#ffffff" } },
      grid: { vertLines: { color: "#eee" }, horzLines: { color: "#eee" } },
      timeScale: { borderColor: "#ddd", timeVisible: false },
      rightPriceScale: { borderColor: "#ddd" },
      localization: { priceFormatter: p => Math.round(p).toLocaleString("id-ID") },
      handleScroll: true,
      handleScale: true,
      attributionLogo: false
    });
    modalCandleSeries = modalChart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
      wickUpColor: "#26a69a", wickDownColor: "#ef5350"
    });
    [10, 20, 50, 100, 200].forEach(p => {
      modalMaSeries[p] = modalChart.addSeries(LightweightCharts.LineSeries, {
        color: MA_COLORS[p], lineWidth: 1, priceLineVisible: false, lastValueVisible: true
      });
    });
    new ResizeObserver(() => {
      modalChart.applyOptions({ width: modalChartEl.clientWidth, height: modalChartEl.clientHeight });
    }).observe(modalChartEl);
  }

  const currentYear = new Date().getFullYear();
  const ytdStart = `${currentYear}-01-01`;
  const ytdCandles = d.candles.filter(c => c.time >= ytdStart);
  const displayCandles = ytdCandles.length > 10 ? ytdCandles : d.candles.slice(-180);
  modalCandleSeries.setData(displayCandles);
  const minTime = displayCandles[0].time;
  [10, 20, 50, 100, 200].forEach(p => {
    modalMaSeries[p].setData(d.ma[p].filter(pt => pt.time >= minTime));
  });
  modalChart.timeScale().fitContent();
}

modalClose.addEventListener("click", () => modalOverlay.classList.remove("open"));
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove("open"); });

(async () => {
  renderGrid(tickers);
  await loadAllData();
})();
</script>

</body>
</html>
