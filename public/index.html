<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>MayoRitas™ — Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-nav">
  <span class="brand">MayoRitas™ </span>
  <a href="index.html" class="active">Home</a>
  <a href="charts.html">Charts</a>
  <a href="screener.html">Screener</a>
  <span class="nav-spacer"></span>
  <span class="live-clock" id="liveClock"></span>
  <button class="icon-btn" id="themeToggle" title="Toggle dark/light">◐</button>
  <button class="icon-btn" id="settingsBtn" title="Atur tampilan dashboard">⚙</button>
</div>

<div class="page-body">
  <div class="narrative-banner"><span class="tag">Outlook</span><span id="narrativeText">Memuat ringkasan…</span></div>
  <div class="dash-grid" id="dashGrid"></div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-drawer">
    <h2>Atur Dashboard</h2>
    <div id="settingsList"></div>
    <button class="reset-btn" id="resetLayoutBtn">Reset ke default</button>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
// ====== DEFINISI CARD ======
// span: 1-4 (lebar relatif di grid desktop 4 kolom; otomatis dipangkas ke maks 2 di mobile)
// real: true = coba tarik data publik beneran; false = placeholder (sumber data belum diputuskan)
// colSpan/rowSpan dalam satuan grid 12-kolom x 26px/baris. Disusun compact biar muat 1 layar tanpa scroll.
const CARD_DEFS = [
  // -- Angka pasar: compact, padat, di atas --
  { id: "ihsg-mini",     group: "Market Pulse",     title: "IHSG",                              colSpan: 2, rowSpan: 3, real: true },
  { id: "us-indices",    group: "Global Context",   title: "US Indices",                         colSpan: 3, rowSpan: 3, real: true },
  { id: "usdidr",        group: "Global Context",   title: "USD/IDR",                            colSpan: 2, rowSpan: 3, real: true },
  { id: "commodities",   group: "Global Context",   title: "Komoditas",                          colSpan: 2, rowSpan: 3, real: true },
  { id: "yield10y",      group: "Global Context",   title: "US 10Y Treasury Yield",              colSpan: 2, rowSpan: 3, real: true },
  { id: "breadth",       group: "Market Pulse",     title: "Breadth IDX (Advance/Decline)",      colSpan: 3, rowSpan: 3, real: false },
  { id: "sector-perf",   group: "Market Pulse",     title: "Performa Sektor Hari Ini",           colSpan: 4, rowSpan: 3, real: false },
  { id: "market-status", group: "Kalender & Konteks", title: "Status Pasar (IDX & US)",           colSpan: 3, rowSpan: 3, real: true },

  // -- Berita: compact list --
  { id: "news-indo",     group: "News",             title: "Headline Indonesia",                 colSpan: 3, rowSpan: 6, real: true },
  { id: "news-global",   group: "News",             title: "Headline Global / US",               colSpan: 3, rowSpan: 6, real: true },
  { id: "news-commodity",group: "News",             title: "Headline Komoditas",                 colSpan: 3, rowSpan: 6, real: true },
  { id: "news-macro",    group: "News",             title: "Headline Ekonomi Makro",             colSpan: 3, rowSpan: 6, real: false },

  // -- Kalender: next upcoming event --
  { id: "econ-calendar", group: "Kalender & Konteks", title: "Kalender Ekonomi",                 colSpan: 6, rowSpan: 5, real: false },

  // -- Meta --
  { id: "last-updated",  group: "Meta",             title: "Terakhir Diperbarui",                colSpan: 2, rowSpan: 2, real: true },
  { id: "sentiment-gauge", group: "Meta",           title: "Sentiment Gauge",                    colSpan: 2, rowSpan: 3, real: false },
];

const DEFAULTS = {};
CARD_DEFS.forEach(c => { DEFAULTS[c.id] = { visible: true, colSpan: c.colSpan, rowSpan: c.rowSpan }; });

let layout = loadDashboardLayout(DEFAULTS);

// ---- Urutan card manual (drag pakai tombol atas/bawah di panel Settings) ----
const ORDER_KEY = "mayoritas_dashboard_order_v1";
function loadOrder() {
  try {
    const saved = JSON.parse(localStorage.getItem(ORDER_KEY) || "[]");
    const known = new Set(CARD_DEFS.map(d => d.id));
    const cleaned = saved.filter(id => known.has(id));
    CARD_DEFS.forEach(d => { if (!cleaned.includes(d.id)) cleaned.push(d.id); });
    return cleaned;
  } catch (e) { return CARD_DEFS.map(d => d.id); }
}
function saveOrder(order) {
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
}
let cardOrder = loadOrder();
function orderedDefs() {
  const byId = Object.fromEntries(CARD_DEFS.map(d => [d.id, d]));
  return cardOrder.map(id => byId[id]).filter(Boolean);
}
function moveCard(id, dir) {
  const i = cardOrder.indexOf(id);
  const j = i + dir;
  if (j < 0 || j >= cardOrder.length) return;
  [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];
  saveOrder(cardOrder);
  renderDashboard();
  renderSettings();
  populateRealCards();
}

const dashGrid = document.getElementById("dashGrid");
const settingsOverlay = document.getElementById("settingsOverlay");
const settingsList = document.getElementById("settingsList");

function isMobileNow() {
  return window.matchMedia("(max-width: 900px)").matches;
}
function effectiveCol(colSpan) {
  const maxCol = isMobileNow() ? 4 : 12;
  return Math.min(colSpan, maxCol);
}

let dragSourceId = null;

function renderDashboard() {
  dashGrid.innerHTML = "";
  orderedDefs().forEach(def => {
    const state = layout[def.id];
    if (!state.visible) return;
    const card = document.createElement("div");
    card.className = "dash-card";
    card.id = "card-" + def.id;
    card.dataset.id = def.id;
    card.style.gridColumn = `span ${effectiveCol(state.colSpan)}`;
    card.style.gridRow = `span ${state.rowSpan}`;
    card.innerHTML = `<h3 draggable="true">${def.title}</h3><div class="card-body">${
      def.real ? "…" : `<span class="placeholder-note">Sumber data belum ditentukan</span>`
    }</div><div class="resize-handle" title="Tarik untuk ubah ukuran"></div>`;
    dashGrid.appendChild(card);
  });
  attachDragAndResize();
}

// ---- Drag untuk pindah posisi (drag judul card ke card lain buat swap urutan) ----
function attachDragAndResize() {
  dashGrid.querySelectorAll(".dash-card").forEach(card => {
    const handle = card.querySelector("h3");
    handle.addEventListener("dragstart", (e) => {
      dragSourceId = card.dataset.id;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    handle.addEventListener("dragend", () => card.classList.remove("dragging"));

    card.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (card.dataset.id !== dragSourceId) card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
    card.addEventListener("drop", (e) => {
      e.preventDefault();
      card.classList.remove("drag-over");
      const targetId = card.dataset.id;
      if (!dragSourceId || dragSourceId === targetId) return;
      const i = cardOrder.indexOf(dragSourceId);
      const j = cardOrder.indexOf(targetId);
      cardOrder.splice(i, 1);
      cardOrder.splice(j, 0, dragSourceId);
      saveOrder(cardOrder);
      renderDashboard();
      populateRealCards();
    });

    // ---- Resize via handle pojok kanan-bawah ----
    const resizeHandle = card.querySelector(".resize-handle");
    resizeHandle.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const id = card.dataset.id;
      const startX = e.clientX, startY = e.clientY;
      const startColSpan = layout[id].colSpan, startRowSpan = layout[id].rowSpan;
      const colWidth = dashGrid.clientWidth / (isMobileNow() ? 4 : 12);

      function onMove(ev) {
        const deltaCol = Math.round((ev.clientX - startX) / colWidth);
        const deltaRow = Math.round((ev.clientY - startY) / 26);
        const maxCol = isMobileNow() ? 4 : 12;
        layout[id].colSpan = Math.max(1, Math.min(maxCol, startColSpan + deltaCol));
        layout[id].rowSpan = Math.max(2, startRowSpan + deltaRow);
        card.style.gridColumn = `span ${effectiveCol(layout[id].colSpan)}`;
        card.style.gridRow = `span ${layout[id].rowSpan}`;
      }
      function onUp() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        saveDashboardLayout(layout);
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}

function renderSettings() {
  settingsList.innerHTML = "";
  orderedDefs().forEach((def, idx) => {
    const state = layout[def.id];
    const row = document.createElement("div");
    row.className = "settings-row";
    row.innerHTML = `
      <label class="row-label"><input type="checkbox" data-id="${def.id}" class="vis-toggle" ${state.visible ? "checked" : ""}> ${def.title}</label>
      <div class="row-controls">
        <button class="move-btn" data-id="${def.id}" data-dir="-1" ${idx === 0 ? "disabled" : ""}>↑</button>
        <button class="move-btn" data-id="${def.id}" data-dir="1" ${idx === cardOrder.length - 1 ? "disabled" : ""}>↓</button>
      </div>
    `;
    settingsList.appendChild(row);
  });

  settingsList.querySelectorAll(".vis-toggle").forEach(el => {
    el.addEventListener("change", () => {
      layout[el.dataset.id].visible = el.checked;
      saveDashboardLayout(layout);
      renderDashboard();
      populateRealCards();
    });
  });
  settingsList.querySelectorAll(".move-btn").forEach(el => {
    el.addEventListener("click", () => moveCard(el.dataset.id, parseInt(el.dataset.dir, 10)));
  });
}

document.getElementById("settingsBtn").addEventListener("click", () => {
  renderSettings();
  settingsOverlay.classList.add("open");
});
settingsOverlay.addEventListener("click", (e) => {
  if (e.target === settingsOverlay) settingsOverlay.classList.remove("open");
});
document.getElementById("resetLayoutBtn").addEventListener("click", () => {
  resetDashboardLayout();
  localStorage.removeItem(ORDER_KEY);
  layout = loadDashboardLayout(DEFAULTS);
  cardOrder = loadOrder();
  renderDashboard();
  renderSettings();
  populateRealCards();
});

window.addEventListener("resize", renderDashboard);

// ====== ISI CARD YANG PUNYA DATA PUBLIK BENERAN ======
function setCardBody(id, html) {
  const el = document.querySelector(`#card-${id} .card-body`);
  if (el) el.innerHTML = html;
}

function chgSpan(chgPct) {
  if (chgPct == null || isNaN(chgPct)) return `<span style="color:var(--text-muted)">-</span>`;
  const color = chgPct >= 0 ? "#00a36c" : "#e5484d";
  const sign = chgPct >= 0 ? "+" : "";
  return `<span style="color:${color}">${sign}${chgPct.toFixed(2)}%</span>`;
}

async function populateRealCards() {
  if (layout["ihsg-mini"].visible) {
    const d = await fetchGlobalCached("^JKSE");
    setCardBody("ihsg-mini", d.ok
      ? `<div style="font-size:20px;font-weight:600">${fmtPrice(d.last)}</div>${chgSpan(d.chgPct)}`
      : `<span class="placeholder-note">Gagal memuat</span>`);
  }

  if (layout["us-indices"].visible) {
    const [sp, ndq, dow] = await Promise.all([
      fetchGlobalCached("^GSPC"), fetchGlobalCached("^IXIC"), fetchGlobalCached("^DJI")
    ]);
    const row = (label, d) => `<div style="display:flex;justify-content:space-between;padding:2px 0">
      <span>${label}</span><span>${d.ok ? fmtPrice(d.last) + " " : ""}${chgSpan(d.ok ? d.chgPct : null)}</span></div>`;
    setCardBody("us-indices", row("S&P 500", sp) + row("Nasdaq", ndq) + row("Dow Jones", dow));
  }

  if (layout["usdidr"].visible) {
    const d = await fetchGlobalCached("IDR=X");
    setCardBody("usdidr", d.ok
      ? `<div style="font-size:18px;font-weight:600">${fmtPrice(d.last)}</div>${chgSpan(d.chgPct)}`
      : `<span class="placeholder-note">Gagal memuat</span>`);
  }

  if (layout["commodities"].visible) {
    const [gold, oil] = await Promise.all([fetchGlobalCached("GC=F"), fetchGlobalCached("CL=F")]);
    const row = (label, d) => `<div style="display:flex;justify-content:space-between;padding:2px 0">
      <span>${label}</span><span>${d.ok ? fmtPrice(d.last) + " " : ""}${chgSpan(d.ok ? d.chgPct : null)}</span></div>`;
    setCardBody("commodities", row("Emas (oz)", gold) + row("Minyak WTI", oil) +
      `<div class="placeholder-note" style="margin-top:6px">Nikel, Batubara, CPO: sumber data belum ditentukan</div>`);
  }

  if (layout["yield10y"].visible) {
    const d = await fetchGlobalCached("^TNX");
    setCardBody("yield10y", d.ok
      ? `<div style="font-size:18px;font-weight:600">${d.last.toFixed(2)}%</div>${chgSpan(d.chgPct)}`
      : `<span class="placeholder-note">Gagal memuat</span>`);
  }

  if (layout["market-status"].visible) {
    const idxOpen = isIdxMarketOpen();
    const usOpen = isUsMarketOpen();
    const badge = (label, open) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px">
      <span style="width:8px;height:8px;border-radius:50%;background:${open ? "#00a36c" : "#999"}"></span>${label}: ${open ? "Buka" : "Tutup"}</span>`;
    setCardBody("market-status", badge("IDX", idxOpen) + badge("US", usOpen));
  }

  if (layout["last-updated"].visible) {
    const now = new Date();
    const wib = new Date(now.getTime() + (7 * 60 - now.getTimezoneOffset()) * 60000);
    const hh = String(wib.getHours()).padStart(2, "0");
    const mm = String(wib.getMinutes()).padStart(2, "0");
    setCardBody("last-updated", `<div>${hh}:${mm} WIB</div>`);
  }

  populateNews();
}

async function populateNews() {
  const map = { "news-indo": "indonesia", "news-global": "global", "news-commodity": "commodity" };
  const res = await fetch("/.netlify/functions/news").then(r => r.json()).catch(() => null);
  if (!res || res.status !== "ok") return;
  Object.entries(map).forEach(([cardId, cat]) => {
    if (!layout[cardId] || !layout[cardId].visible) return;
    const items = res.categories[cat] || [];
    setCardBody(cardId, items.length
      ? items.slice(0, 5).map(n =>
          `<div class="news-item"><a href="${n.link}" target="_blank" rel="noopener">${n.title}</a></div>`
        ).join("")
      : `<span class="placeholder-note">Tidak ada data</span>`);
  });
}

const narrativeEl = document.getElementById("narrativeText");
if (narrativeEl) narrativeEl.textContent = "Ringkasan outlook harian belum tersambung ke sumber data — placeholder sampai naskah otomatis disiapkan.";

startLiveClock(document.getElementById("liveClock"));
document.getElementById("themeToggle").addEventListener("click", toggleTheme);

renderDashboard();
populateRealCards();
</script>
</body>
</html>
